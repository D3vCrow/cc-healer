name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: this workflow only reads the repo to test it.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      # Actions pinned to commit SHA, not tag: a tag can be moved onto malicious
      # code by whoever controls the action repo (see tj-actions/changed-files,
      # 2025). The trailing `# ratchet:` comment keeps the human-readable version
      # and lets sethvargo/ratchet re-resolve on upgrade.
      #
      # If this repo grows a publish/release workflow, carry the same pinning
      # convention and add: `npm publish --provenance --access public` plus
      # GPG-signed release commits/tags (vercel-labs/skills publish.yml pattern).
      #
      # v5 targets node24. v4 targeted node20, which GitHub deprecated and was
      # force-running on node24 anyway - every job logged a deprecation warning.
      # This is the action's own runtime and is unrelated to the `node:` matrix
      # below, which is the Node version cc-healer itself is tested against.
      # persist-credentials: false — checkout otherwise leaves the job's token in
      # .git/config for every later step to read. This job only runs `npm ci` and
      # `npm test`, so nothing needs it. Defence in depth: the token is already
      # read-only via the `permissions:` block above, so this closes the smaller
      # "a compromised dependency reads the token from the working tree" path
      # rather than a write path. (Pattern seen in nanonets/graft's workflows;
      # vet: F:/DevCrow/Dev/knowledge/research/2026-08-10-vet-graft.md)
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # ratchet:actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
